<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccchat dashboard</title>
<style>
:root {
  --bg: #1a1b26;
  --bg-surface: #24283b;
  --bg-hover: #2f3349;
  --border: #3b3f54;
  --text: #c0caf5;
  --text-dim: #565f89;
  --text-bright: #e0e6ff;
  --accent: #7aa2f7;
  --green: #9ece6a;
  --red: #f7768e;
  --yellow: #e0af68;
  --cyan: #7dcfff;
  --magenta: #bb9af7;
  --orange: #ff9e64;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

/* ── Layout ─────────────────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: 200px 1fr;
  grid-template-rows: auto 1fr;
  height: 100vh;
}

.header {
  grid-column: 1 / -1;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.header h1 {
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
}

.header .status {
  font-size: 11px;
  color: var(--text-dim);
}

.header .status.connected { color: var(--green); }
.header .status.disconnected { color: var(--red); }

.search-box {
  margin-left: auto;
  display: flex;
  gap: 6px;
}

.search-box input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  width: 200px;
}

.search-box input:focus { outline: none; border-color: var(--accent); }
.search-box button {
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 4px;
  padding: 4px 10px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
}

/* ── Sidebar ────────────────────────────────────────────────────────── */
.sidebar {
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.sidebar-section {
  padding: 10px 12px 6px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  font-weight: 600;
}

.room-item {
  padding: 6px 12px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
}

.room-item:hover { background: var(--bg-hover); }
.room-item.active { background: var(--bg-hover); color: var(--accent); font-weight: 600; }

.room-badge {
  background: var(--accent);
  color: var(--bg);
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 8px;
  font-weight: 600;
}

.agent-item {
  padding: 6px 12px;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.agent-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
}

.agent-name { font-weight: 500; }
.agent-project { color: var(--text-dim); font-size: 11px; }

/* ── Main area ──────────────────────────────────────────────────────── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Pinned bar ─────────────────────────────────────────────────────── */
.pinned-bar {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  max-height: 120px;
  overflow-y: auto;
  display: none;
}

.pinned-bar.has-pins { display: block; }

.pinned-toggle {
  padding: 4px 12px;
  font-size: 11px;
  color: var(--yellow);
  cursor: pointer;
  user-select: none;
}

.pinned-msg {
  padding: 3px 12px 3px 24px;
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Message feed ───────────────────────────────────────────────────── */
.feed {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.msg {
  padding: 4px 16px;
  line-height: 1.5;
}

.msg:hover { background: var(--bg-surface); }

.msg-header {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.msg-author {
  font-weight: 600;
  font-size: 13px;
}

.msg-time {
  font-size: 11px;
  color: var(--text-dim);
}

.msg-id {
  font-size: 10px;
  color: var(--text-dim);
}

.msg-badges { display: inline-flex; gap: 4px; }

.badge {
  font-size: 9px;
  padding: 1px 4px;
  border-radius: 3px;
  font-weight: 600;
  text-transform: uppercase;
}

.badge-urgent { background: var(--red); color: var(--bg); }
.badge-pin { background: var(--yellow); color: var(--bg); }
.badge-question { background: var(--cyan); color: var(--bg); }
.badge-task { background: var(--magenta); color: var(--bg); }
.badge-system { background: var(--text-dim); color: var(--bg); }
.badge-verified { background: var(--green); color: var(--bg); }
.badge-digest { background: var(--orange); color: var(--bg); }

.msg-reply {
  font-size: 11px;
  color: var(--text-dim);
  margin-left: 4px;
  cursor: pointer;
}

.msg-reply:hover { color: var(--accent); }

.msg-body {
  margin-top: 2px;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text-bright);
}

.msg-body.system-body { color: var(--text-dim); font-style: italic; }

.msg-mentions {
  color: var(--accent);
  font-weight: 600;
}

/* ── Thread view ────────────────────────────────────────────────────── */
.thread-panel {
  display: none;
  width: 350px;
  border-left: 1px solid var(--border);
  background: var(--bg-surface);
  overflow-y: auto;
  flex-shrink: 0;
}

.thread-panel.open { display: flex; flex-direction: column; }

.thread-header {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 600;
}

.thread-close {
  cursor: pointer;
  color: var(--text-dim);
  font-size: 16px;
}

.thread-close:hover { color: var(--text); }

.thread-messages {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

/* ── Search results ─────────────────────────────────────────────────── */
.search-results {
  display: none;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  max-height: 300px;
  overflow-y: auto;
}

.search-results.open { display: block; }

.search-results-header {
  padding: 6px 12px;
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
}

.search-results-close {
  cursor: pointer;
  color: var(--text-dim);
}

.search-results-close:hover { color: var(--text); }

/* ── Load more ──────────────────────────────────────────────────────── */
.load-more {
  text-align: center;
  padding: 8px;
}

.load-more button {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 4px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
}

.load-more button:hover { border-color: var(--accent); color: var(--accent); }

/* ── Input bar ──────────────────────────────────────────────────────── */
.input-bar {
  border-top: 1px solid var(--border);
  background: var(--bg-surface);
  padding: 8px 12px;
  display: flex;
  gap: 8px;
  align-items: center;
}

.input-bar input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 10px;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
}

.input-bar input:focus { outline: none; border-color: var(--accent); }

.input-bar button {
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 4px;
  padding: 8px 16px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
}

.input-bar button:hover { opacity: 0.9; }

.reply-indicator {
  display: none;
  font-size: 11px;
  color: var(--text-dim);
  padding: 4px 12px;
  background: var(--bg-surface);
  border-top: 1px solid var(--border);
}

.reply-indicator.active { display: flex; align-items: center; gap: 8px; }

.reply-indicator .cancel-reply {
  cursor: pointer;
  color: var(--red);
  font-weight: 600;
}

/* ── Scrollbar ──────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* ── Modal ─────────────────────────────────────────────────────────── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  width: 320px;
  max-height: 80vh;
  overflow-y: auto;
}
.modal h2 { font-size: 14px; margin-bottom: 12px; color: var(--accent); }
.modal label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; }
.modal input[type="text"] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 8px;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  margin-bottom: 12px;
}
.modal input[type="text"]:focus { outline: none; border-color: var(--accent); }
.modal .agent-check { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 12px; }
.modal .agent-check input { margin: 0; }
.modal .modal-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
.modal .modal-actions button {
  border: none; border-radius: 4px; padding: 6px 14px;
  font-family: inherit; font-size: 12px; cursor: pointer;
}
.modal .btn-create { background: var(--accent); color: var(--bg); font-weight: 600; }
.modal .btn-cancel { background: var(--bg); color: var(--text-dim); border: 1px solid var(--border) !important; }
.modal .modal-error { color: var(--red); font-size: 11px; margin-bottom: 8px; display: none; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>ccchat</h1>
    <span class="status disconnected" id="status">connecting...</span>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search messages...">
      <button id="search-btn">Search</button>
    </div>
    <button id="quit-btn" title="Quit dashboard (Ctrl+Q)" style="background:var(--red);color:var(--bg);border:none;border-radius:4px;padding:4px 10px;font-family:inherit;font-size:12px;cursor:pointer;margin-left:8px;">Quit</button>
  </div>

  <div class="sidebar">
    <div class="sidebar-section">Rooms</div>
    <div id="room-list"></div>
    <div style="padding:6px 12px;">
      <button id="create-room-btn" style="width:100%;background:none;border:1px dashed var(--border);color:var(--text-dim);border-radius:4px;padding:4px;font-family:inherit;font-size:11px;cursor:pointer;">+ Room</button>
    </div>
    <div class="sidebar-section" style="margin-top:12px">Online</div>
    <div id="agent-list"></div>
  </div>

  <!-- Create Room Modal -->
  <div class="modal-overlay" id="create-room-modal">
    <div class="modal">
      <h2>Create Room</h2>
      <label for="new-room-name">Room name</label>
      <input type="text" id="new-room-name" placeholder="e.g. design-review">
      <div class="modal-error" id="room-error"></div>
      <label>Invite agents</label>
      <div id="invite-agent-list" style="margin-bottom:4px;max-height:150px;overflow-y:auto;"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="room-modal-cancel">Cancel</button>
        <button class="btn-create" id="room-modal-create">Create</button>
      </div>
    </div>
  </div>

  <div class="main" style="display:flex; flex-direction:row;">
    <div style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
      <div class="pinned-bar" id="pinned-bar">
        <div class="pinned-toggle" id="pinned-toggle"></div>
        <div id="pinned-list"></div>
      </div>
      <div class="search-results" id="search-results">
        <div class="search-results-header">
          <span id="search-count"></span>
          <span class="search-results-close" id="search-close">&times;</span>
        </div>
        <div id="search-list"></div>
      </div>
      <div class="load-more" id="load-more" style="display:none">
        <button id="load-more-btn">Load older messages</button>
      </div>
      <div class="feed" id="feed"></div>
      <div class="reply-indicator" id="reply-indicator">
        <span id="reply-label">Replying to #</span>
        <span class="cancel-reply" id="cancel-reply">&times; cancel</span>
      </div>
      <div class="input-bar">
        <input type="text" id="msg-input" placeholder="Type a message... (use @name for mentions)">
        <button id="send-btn">Send</button>
      </div>
    </div>
    <div class="thread-panel" id="thread-panel">
      <div class="thread-header">
        <span>Thread</span>
        <span class="thread-close" id="thread-close">&times;</span>
      </div>
      <div class="thread-messages" id="thread-messages"></div>
    </div>
  </div>

</div>

<script>
// ── State ──────────────────────────────────────────────────────────────

let currentRoom = 'general';
let rooms = [];
let agents = [];
let messages = [];       // current room messages
let hasMore = false;
let oldestId = null;
let autoScroll = true;

// ── Agent colors (ported from chat-ui.js nameColor hash) ───────────

const AGENT_COLORS = [
  '#f7768e', '#ff9e64', '#e0af68', '#9ece6a',
  '#73daca', '#7dcfff', '#7aa2f7', '#bb9af7',
];

function nameColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return AGENT_COLORS[h % AGENT_COLORS.length];
}

// ── Rendering ──────────────────────────────────────────────────────────

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightMentions(text) {
  return escapeHtml(text).replace(/@(\w[\w-]*)/g, '<span class="msg-mentions">@$1</span>');
}

function renderMsg(msg, container) {
  const el = document.createElement('div');
  el.className = 'msg';
  el.dataset.id = msg.id;

  const badges = [];
  if (msg.priority === 'urgent') badges.push('<span class="badge badge-urgent">urgent</span>');
  if (msg.pinned) badges.push('<span class="badge badge-pin">pin</span>');
  if (msg.type === 'question') badges.push('<span class="badge badge-question">Q</span>');
  if (msg.type === 'task') badges.push('<span class="badge badge-task">' + (msg.task_status || 'task') + '</span>');
  if (msg.type === 'system') badges.push('<span class="badge badge-system">system</span>');
  if (msg.evidence) badges.push('<span class="badge badge-verified">verified</span>');
  if (msg.compact) badges.push('<span class="badge badge-digest">digest</span>');

  const reply = msg.parent_id
    ? `<span class="msg-reply" data-thread="${msg.parent_id}">&uarr; reply to #${msg.parent_id}</span>`
    : '';

  const time = (msg.created_at || '').slice(11, 16);
  const color = nameColor(msg.from);
  const bodyClass = msg.type === 'system' ? 'msg-body system-body' : 'msg-body';

  el.innerHTML = `
    <div class="msg-header">
      <span class="msg-author" style="color:${color}">${escapeHtml(msg.from)}</span>
      <span class="msg-time">${time}</span>
      <span class="msg-id">#${msg.id}</span>
      <span class="msg-badges">${badges.join('')}</span>
      ${reply}
      <span class="msg-reply" data-reply-id="${msg.id}" style="margin-left:auto; cursor:pointer; font-size:11px; color:var(--text-dim);">&larr; reply</span>
    </div>
    <div class="${bodyClass}">${highlightMentions(msg.content)}</div>
  `;

  // Thread click handler (for "reply to #X" links)
  el.querySelectorAll('[data-thread]').forEach(r => {
    r.addEventListener('click', () => openThread(parseInt(r.dataset.thread, 10)));
  });

  // Reply button handler
  el.querySelectorAll('[data-reply-id]').forEach(r => {
    r.addEventListener('click', () => setReplyTo(parseInt(r.dataset.replyId, 10)));
  });

  container.appendChild(el);
  return el;
}

function renderFeed() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  for (const msg of messages) {
    renderMsg(msg, feed);
  }
  if (autoScroll) feed.scrollTop = feed.scrollHeight;

  // Load more
  const lm = document.getElementById('load-more');
  lm.style.display = hasMore ? 'block' : 'none';
}

function renderRooms() {
  const list = document.getElementById('room-list');
  list.innerHTML = '';
  for (const r of rooms) {
    const el = document.createElement('div');
    el.className = 'room-item' + (r.name === currentRoom ? ' active' : '');
    const deleteBtn = r.name === 'general' ? '' :
      `<span class="room-delete" data-room="${escapeHtml(r.name)}" title="Delete room" style="color:var(--text-dim);cursor:pointer;font-size:14px;margin-left:4px;">&times;</span>`;
    el.innerHTML = `<span>#${escapeHtml(r.name)}</span>` +
      `<span style="margin-left:auto;display:flex;align-items:center;gap:4px;">` +
      (r.count ? `<span class="room-badge">${r.count}</span>` : '') +
      deleteBtn + `</span>`;
    el.querySelector('span').addEventListener('click', () => switchRoom(r.name));
    const del = el.querySelector('.room-delete');
    if (del) {
      del.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm(`Delete room "${r.name}" and all its messages?`)) return;
        try {
          await fetch('/api/rooms/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ room: r.name }),
          });
          if (currentRoom === r.name) await switchRoom('general');
          await loadRooms();
        } catch {}
      });
    }
    list.appendChild(el);
  }
}

function renderAgents() {
  const list = document.getElementById('agent-list');
  list.innerHTML = '';
  for (const a of agents) {
    const el = document.createElement('div');
    el.className = 'agent-item';
    const color = nameColor(a.name);
    const proj = a.project.split('/').pop();
    const showProj = proj !== a.name ? `<span class="agent-project">${escapeHtml(proj)}</span>` : '';
    const roomList = (a.rooms || []).map(r => '#' + r).join(' ');
    el.innerHTML = `<div style="display:flex;align-items:center;gap:6px;">` +
      `<span class="agent-dot" style="background:${color}"></span>` +
      `<span class="agent-name" style="color:${color}">${escapeHtml(a.name)}</span>` +
      showProj + `</div>` +
      `<div style="font-size:10px;color:var(--text-dim);padding-left:12px;">${escapeHtml(roomList)}</div>`;
    list.appendChild(el);
  }
  if (agents.length === 0) {
    list.innerHTML = '<div class="agent-item" style="color:var(--text-dim)">No agents online</div>';
  }
}

function renderPinned(pins) {
  const bar = document.getElementById('pinned-bar');
  const toggle = document.getElementById('pinned-toggle');
  const list = document.getElementById('pinned-list');

  if (!pins || pins.length === 0) {
    bar.classList.remove('has-pins');
    return;
  }

  bar.classList.add('has-pins');
  toggle.textContent = `\u{1F4CC} ${pins.length} pinned message(s)`;
  list.innerHTML = '';
  for (const p of pins) {
    const el = document.createElement('div');
    el.className = 'pinned-msg';
    el.textContent = `#${p.id} ${p.from}: ${p.content.slice(0, 120)}`;
    list.appendChild(el);
  }
}

// ── API calls ──────────────────────────────────────────────────────────

async function api(path) {
  const res = await fetch(path);
  return res.json();
}

async function loadRooms() {
  rooms = await api('/api/rooms');
  renderRooms();
}

async function loadAgents() {
  agents = await api('/api/agents');
  renderAgents();
}

async function loadHistory(room, last = 50, before = null) {
  const url = `/api/history?room=${encodeURIComponent(room)}&last=${last}` +
    (before ? `&before=${before}` : '');
  const data = await api(url);
  return data;
}

async function loadPinned(room) {
  const pins = await api(`/api/pinned?room=${encodeURIComponent(room)}`);
  renderPinned(pins);
}

async function switchRoom(room) {
  currentRoom = room;
  messages = [];
  hasMore = false;
  oldestId = null;
  renderRooms();

  const data = await loadHistory(room);
  messages = data.messages;
  hasMore = data.has_more;
  if (messages.length > 0) oldestId = messages[0].id;
  autoScroll = true;
  renderFeed();
  loadPinned(room);
}

// ── Load more ──────────────────────────────────────────────────────────

document.getElementById('load-more-btn').addEventListener('click', async () => {
  if (!hasMore || !oldestId) return;
  const data = await loadHistory(currentRoom, 50, oldestId);
  messages = [...data.messages, ...messages];
  hasMore = data.has_more;
  if (messages.length > 0) oldestId = messages[0].id;
  autoScroll = false;
  renderFeed();
});

// ── Track auto-scroll ──────────────────────────────────────────────────

document.getElementById('feed').addEventListener('scroll', function() {
  const el = this;
  autoScroll = (el.scrollHeight - el.scrollTop - el.clientHeight) < 40;
});

// ── Thread panel ───────────────────────────────────────────────────────

async function openThread(parentId) {
  const panel = document.getElementById('thread-panel');
  const container = document.getElementById('thread-messages');
  panel.classList.add('open');
  container.innerHTML = '';

  const thread = await api(`/api/thread?id=${parentId}`);
  for (const msg of thread) {
    renderMsg(msg, container);
  }
}

document.getElementById('thread-close').addEventListener('click', () => {
  document.getElementById('thread-panel').classList.remove('open');
});

// ── Search ─────────────────────────────────────────────────────────────

async function doSearch() {
  const query = document.getElementById('search-input').value.trim();
  if (!query) return;

  const results = await api(`/api/search?room=${encodeURIComponent(currentRoom)}&q=${encodeURIComponent(query)}`);
  const panel = document.getElementById('search-results');
  const list = document.getElementById('search-list');
  const count = document.getElementById('search-count');

  panel.classList.add('open');
  count.textContent = `${results.length} result(s) for "${query}"`;
  list.innerHTML = '';
  for (const msg of results) {
    renderMsg(msg, list);
  }
}

document.getElementById('search-btn').addEventListener('click', doSearch);
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
document.getElementById('search-close').addEventListener('click', () => {
  document.getElementById('search-results').classList.remove('open');
});

// ── SSE connection ─────────────────────────────────────────────────────

let es;

function connectSSE() {
  es = new EventSource('/api/events');
  const statusEl = document.getElementById('status');

  es.onopen = () => {
    statusEl.textContent = 'connected';
    statusEl.className = 'status connected';
  };

  es.onerror = () => {
    statusEl.textContent = 'disconnected';
    statusEl.className = 'status disconnected';
  };

  es.addEventListener('messages', (e) => {
    const newMsgs = JSON.parse(e.data);
    for (const msg of newMsgs) {
      if (msg.room === currentRoom) {
        // Deduplicate
        if (!messages.find(m => m.id === msg.id)) {
          messages.push(msg);
        }
      }
    }
    // Re-render if any messages were for current room
    if (newMsgs.some(m => m.room === currentRoom)) {
      renderFeed();
    }
    // Update room counts
    loadRooms();
  });

  es.addEventListener('agents', (e) => {
    agents = JSON.parse(e.data);
    renderAgents();
  });
}

// ── Send messages ──────────────────────────────────────────────────────

let replyToId = null;

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  const body = { message: text, room: currentRoom };
  if (replyToId) body.replyTo = replyToId;

  try {
    const res = await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (res.ok) {
      input.value = '';
      cancelReply();
    }
  } catch {}
}

function setReplyTo(id) {
  replyToId = id;
  const indicator = document.getElementById('reply-indicator');
  const label = document.getElementById('reply-label');
  indicator.classList.add('active');
  label.textContent = `Replying to #${id}`;
  document.getElementById('msg-input').focus();
}

function cancelReply() {
  replyToId = null;
  document.getElementById('reply-indicator').classList.remove('active');
}

document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});
document.getElementById('cancel-reply').addEventListener('click', cancelReply);

// ── Pinned toggle ──────────────────────────────────────────────────────

let pinnedExpanded = true;
document.getElementById('pinned-toggle').addEventListener('click', () => {
  pinnedExpanded = !pinnedExpanded;
  document.getElementById('pinned-list').style.display = pinnedExpanded ? 'block' : 'none';
});

// ── Init ───────────────────────────────────────────────────────────────

async function init() {
  await loadRooms();
  await loadAgents();
  await switchRoom(rooms.length > 0 ? rooms[0].name : 'general');
  connectSSE();
}

init();

// ── Create room + invite ──────────────────────────────────────────────

document.getElementById('create-room-btn').addEventListener('click', () => {
  const modal = document.getElementById('create-room-modal');
  const nameInput = document.getElementById('new-room-name');
  const errEl = document.getElementById('room-error');
  const list = document.getElementById('invite-agent-list');

  nameInput.value = '';
  errEl.style.display = 'none';
  list.innerHTML = '';

  // Populate online agents as checkboxes
  for (const a of agents) {
    const div = document.createElement('div');
    div.className = 'agent-check';
    const color = nameColor(a.name);
    div.innerHTML = `<input type="checkbox" value="${escapeHtml(a.name)}"> <span style="color:${color}">${escapeHtml(a.name)}</span>`;
    list.appendChild(div);
  }

  modal.classList.add('open');
  nameInput.focus();
});

document.getElementById('room-modal-cancel').addEventListener('click', () => {
  document.getElementById('create-room-modal').classList.remove('open');
});

document.getElementById('create-room-modal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});

document.getElementById('room-modal-create').addEventListener('click', async () => {
  const nameInput = document.getElementById('new-room-name');
  const errEl = document.getElementById('room-error');
  const roomName = nameInput.value.trim().toLowerCase();

  if (!roomName || !/^[a-z0-9][a-z0-9-]*$/.test(roomName)) {
    errEl.textContent = 'Lowercase letters, numbers, and hyphens only';
    errEl.style.display = 'block';
    return;
  }

  try {
    const res = await fetch('/api/rooms/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: roomName }),
    });
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || 'Failed to create room';
      errEl.style.display = 'block';
      return;
    }

    // Collect invited agents
    const invited = [...document.querySelectorAll('#invite-agent-list input:checked')]
      .map(cb => cb.value);

    // Send invite @mentions to general
    if (invited.length > 0) {
      const mentions = invited.map(n => '@' + n).join(', ');
      await fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: `Created #${roomName} and invited ${mentions} — join with /ccchat`,
          room: 'general',
        }),
      });
    }

    document.getElementById('create-room-modal').classList.remove('open');
    await loadRooms();
    await switchRoom(roomName);
  } catch {
    errEl.textContent = 'Network error';
    errEl.style.display = 'block';
  }
});

document.getElementById('new-room-name').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('room-modal-create').click();
  if (e.key === 'Escape') document.getElementById('room-modal-cancel').click();
});

// ── Quit dashboard ────────────────────────────────────────────────────

document.getElementById('quit-btn').addEventListener('click', async () => {
  if (!confirm('Shut down the dashboard?')) return;
  try {
    await fetch('/api/shutdown', { method: 'POST' });
  } catch {}
  document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-dim);font-family:monospace;">Dashboard stopped.</div>';
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'q') {
    e.preventDefault();
    document.getElementById('quit-btn').click();
  }
});
</script>
